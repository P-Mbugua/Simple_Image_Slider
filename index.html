<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider-container">
    <div class="slider">
      <div class="slide active">
        <img src="https://images.unsplash.com/photo-1735583100223-40a01e52ef0a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw0fHx8ZW58MHx8fHx8" alt="Slide 1">
        <div class="caption">
          <h2>Welcome to Mbugua Peter's Website</h2>
          <p>Experience creativity and professionalism.</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1735122787856-3537228a5e96?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzOHx8fGVufDB8fHx8fA%3D%3D" alt="Slide 2">
        <div class="caption">
          <h2>Professional Solutions</h2>
          <p>Innovative and reliable designs.</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1736401762820-a114e32f0072?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMHx8fGVufDB8fHx8fA%3D%3D" alt="Slide 3">
        <div class="caption">
          <h2>Responsive Designs</h2>
          <p>Adapting to all screen sizes.</p>
        </div>
      </div>
    </div>
    <div class="indicators">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <footer>
    <p>
      Proudly done by 
      <a href="https://mbuguapeter.netlify.app/" target="_blank">Mbugua Peter</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
